<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Rounded Square -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <!-- Graduation Cap Rhombus Top -->
  <polygon points="32,16 53,26 32,36 11,26" fill="#ffffff" filter="url(#glow)"/>
  <!-- Cap Skull Base -->
  <path d="M20,31.5 L20,40 C20,45.5 44,45.5 44,40 L44,31.5" fill="#e2e8f0" />
  <!-- Tassel Cord & Bead -->
  <path d="M47,29 L51,38" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <circle cx="51.5" cy="41" r="2.5" fill="#38bdf8" />
</svg>
